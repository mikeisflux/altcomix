# NSFWComix — nginx site. Install as /etc/nginx/sites-available/nsfwcomix and
# symlink into sites-enabled. Change nsfwcomix.com and the /srv/nsfwcomix
# path, then run certbot (it adds the listen 443 / certificate lines):
#
#   sudo certbot --nginx -d nsfwcomix.com -d www.nsfwcomix.com
#
# What it does:
#   /assets/*      built web client files, straight from disk, cached for a year
#   /api/, /media/ proxied to the Node API on 127.0.0.1:4000
#   everything else: the single-page app (index.html), never cached
#
# CLIENT ADDRESS: the API takes the visitor's address from the LAST entry of
# X-Forwarded-For, i.e. the one this nginx appends. The bot blocker, rate
# limits and login audit all depend on it. If you put Cloudflare or another
# proxy in front, uncomment the real_ip block below, or every visitor will
# look like the proxy and one block would lock everybody out.

upstream nsfwcomix_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Uploads of whole issues (PDF / CBZ / page images) go through /api/.
client_max_body_size 650m;

server {
    listen 80;
    listen [::]:80;
    server_name nsfwcomix.com www.nsfwcomix.com;

    root /srv/nsfwcomix/web/dist;
    index index.html;

    # --- Behind Cloudflare (or another trusted proxy) only -----------------
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;   # list every range from https://www.cloudflare.com/ips/
    # real_ip_recursive on;
    # -----------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml application/manifest+json;

    # Dotfiles (.env, .git ...) are never served.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Fingerprinted build output: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://nsfwcomix_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the address nginx saw; anything the client sent stays to the left and is ignored by the API.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads are streamed to the API instead of being spooled to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # A worker being replaced during a deploy: try the connection again rather than show an error.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Page images and covers. Private pages are authorised by the API on every request.
    location /media/ {
        proxy_pass http://nsfwcomix_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 120s;
    }

    # Files in web/dist that exist (favicon, manifest, service worker); otherwise the app shell.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
